<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação Oficial - MundoNet</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0f172a;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            color: white;
        }
        .slide-container {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            position: relative;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
        }
        .slide-image {
            max-width: 95%; max-height: 90%;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 8px;
            transition: opacity 0.3s ease;
        }
        .controls {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 20px; align-items: center;
            background: rgba(15, 23, 42, 0.7);
            padding: 10px 25px;
            border-radius: 40px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .btn {
            background: none; border: none; color: white;
            font-size: 22px; cursor: pointer;
            width: 45px; height: 45px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(59, 130, 246, 0.5);
            transform: scale(1.1);
        }
        .counter {
            font-size: 18px; font-weight: 600; min-width: 90px; text-align: center;
            letter-spacing: 1px;
        }
        .nav-zone {
            position: absolute; top: 0; bottom: 0; width: 30%; z-index: 50; cursor: pointer;
        }
        .nav-left { left: 0; }
        .nav-right { right: 0; }
        .home-btn {
            position: absolute; top: 20px; left: 20px;
            z-index: 100; font-size: 16px; text-decoration: none; color: white;
            background: rgba(15, 23, 42, 0.7); padding: 10px 20px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); transition: 0.2s;
            backdrop-filter: blur(10px);
            display: flex; align-items: center; gap: 10px;
        }
        .home-btn:hover { background: #3b82f6; border-color: #60a5fa; }
        
        /* Loading indicator */
        .loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #3b82f6;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
            z-index: 10;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>
    <a href="index.html" class="home-btn"><i class="fa-solid fa-arrow-left"></i> Voltar ao Curso</a>

    <div class="nav-zone nav-left" onclick="prevSlide()" title="Anterior"></div>
    <div class="nav-zone nav-right" onclick="nextSlide()" title="Próximo"></div>

    <div class="slide-container">
        <div class="loader" id="loader"></div>
        <img id="current-slide" class="slide-image" src="" alt="Slide">
        
        <div class="controls">
            <button class="btn" onclick="prevSlide()" title="Anterior (Seta Esquerda)"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="counter" id="slide-counter">1 / 113</span>
            <button class="btn" onclick="nextSlide()" title="Próximo (Seta Direita ou Espaço)"><i class="fa-solid fa-chevron-right"></i></button>
            <button class="btn" onclick="toggleFullScreen()" title="Tela Cheia"><i class="fa-solid fa-expand"></i></button>
        </div>
    </div>

    <script>
        // Carregar a lista de imagens extraídas
        const slides = [];
        for(let i=1; i<=67; i++) {
            slides.push('images/sup1_page' + i + '.png');
        }
        for(let i=1; i<=46; i++) {
            slides.push('images/sup2_page' + i + '.png');
        }

        let currentIndex = 0;
        const imgElement = document.getElementById('current-slide');
        const counterElement = document.getElementById('slide-counter');
        const loader = document.getElementById('loader');

        function updateSlide() {
            imgElement.style.opacity = 0;
            loader.style.display = 'block';
            
            // Preload next image logic to make transitions faster
            const preloadImg = new Image();
            preloadImg.src = slides[currentIndex];
            
            preloadImg.onload = () => {
                imgElement.src = slides[currentIndex];
                counterElement.textContent = (currentIndex + 1) + ' / ' + slides.length;
                loader.style.display = 'none';
                imgElement.style.opacity = 1;
            };

            // Preload the next one quietly
            if (currentIndex < slides.length - 1) {
                const nextImg = new Image();
                nextImg.src = slides[currentIndex + 1];
            }
        }

        function nextSlide() {
            if (currentIndex < slides.length - 1) {
                currentIndex++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlide();
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Suporte a teclado para navegação
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault(); // Impede rolagem na barra de espaço
                nextSlide();
            }
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Iniciar apresentação
        updateSlide();
    </script>
</body>
</html>
